# TEMPLATE ONLY - do not commit a real API key in this file.
# A plaintext Secret in Git is readable by everyone who can clone the repository.
# Create the Secret out of band, or commit it encrypted, for example:
#   kubectl create secret generic weather-api-key -n <namespace> \
#     --from-literal=WEATHER_API_KEY=<key> --dry-run=client -o yaml \
#     | kubeseal --format yaml > backend-api-secrets.yaml
# or reference it from a secret store with an ExternalSecret.
# See Chapter 12, "Managing secrets securely in GitOps workflows".
apiVersion: v1
kind: Secret
metadata:
  name: weather-api-key
  namespace: weather-app-for-real
type: Opaque
data:
  WEATHER_API_KEY: YOUR_API_TOKEN_GOES_HERE
