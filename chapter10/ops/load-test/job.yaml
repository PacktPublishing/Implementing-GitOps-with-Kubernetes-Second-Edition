apiVersion: batch/v1
kind: Job
metadata:
  name: weather-load-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        # Matches the ingress rule in apps/weather/base/networkpolicy.yaml.
        app.kubernetes.io/component: load-generator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "/scripts/script.js"]
          env:
            - name: TARGET_URL
              value: http://weather-app   # or https://weather-<env>.<your-domain>
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: weather-load-test
        - name: tmp
          emptyDir: {}
