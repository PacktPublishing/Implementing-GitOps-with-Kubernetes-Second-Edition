# TEMPLATE ONLY - do not commit real values in this file.
# A plaintext Secret in Git is readable by everyone who can clone the repository.
# Create the credentials out of band, or commit them encrypted, for example:
#   flux create secret git github-repository-secret -n flux-system \
#     --url=https://github.com/<owner>/<repo> --username=git --password=<PAT> \
#     --export | kubeseal --format yaml > github-repository-secret.yaml
# See Chapter 12, "Managing secrets securely in GitOps workflows".
apiVersion: v1
kind: Secret
metadata:
  name: github-repository-secret
  namespace: flux-system
type: Opaque
data:
  username: [YOUR_ENCODED_USERNAME]
  password: [YOUR_ENCODED_PASSWORD]
