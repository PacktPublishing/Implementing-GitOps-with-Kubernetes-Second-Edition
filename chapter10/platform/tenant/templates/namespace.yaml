apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace is required" .Values.namespace }}
  labels:
    team: {{ .Values.team }}
    tier: {{ .Values.tier }}
    # Pod Security Admission: every tenant workload must meet "restricted".
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
