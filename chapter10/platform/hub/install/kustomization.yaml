# Argo CD 3.5.6, non-HA, pinned to the release tag. Apply with server-side
# apply: the ApplicationSet CRD is too large for client-side apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  - path: argocd-cm.yaml
  # Entra Workload ID for the three components that talk to remote clusters.
  - path: workload-identity.yaml
    target:
      kind: ServiceAccount
      name: argocd-(application-controller|applicationset-controller|server)
  - path: workload-identity-pod.yaml
    target:
      group: apps
      name: argocd-(application-controller|applicationset-controller|server)
