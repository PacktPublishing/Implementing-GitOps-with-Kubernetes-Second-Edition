# Kargo needs to write to Git (commit, push, open pull requests). The token
# lives in Key Vault; External Secrets Operator materialises it as a Secret
# carrying the label Kargo looks for. Use a fine-grained token scoped to this
# repository with Contents and Pull requests: read/write, or a GitHub App.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-git-secrets
  namespace: weather
  annotations:
    azure.workload.identity/client-id: REPLACE_WITH_KARGO_GIT_CLIENT_ID
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: key-vault
  namespace: weather
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      tenantId: REPLACE_WITH_TENANT_ID
      vaultUrl: REPLACE_WITH_KEY_VAULT_URI
      serviceAccountRef:
        name: kargo-git-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-credentials
  namespace: weather
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: github-credentials
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/PacktPublishing/Implementing-GitOps-with-Kubernetes-Second-Edition.git
        username: kargo
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: kargo-github-token
