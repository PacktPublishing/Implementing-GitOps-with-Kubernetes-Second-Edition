apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: cloud-secrets
  target:
    name: weather-api
    creationPolicy: Owner
    deletionPolicy: Retain    # a missing remote value never blanks a running app
  data:
    - secretKey: WEATHER_API_KEY
      remoteRef:
        key: weather-api-key-ENV   # patched per environment
