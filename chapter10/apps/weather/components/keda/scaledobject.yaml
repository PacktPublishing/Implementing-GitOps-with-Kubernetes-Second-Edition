# KEDA creates and owns an HPA (keda-hpa-weather-app). Never combine this
# component with ../hpa: two autoscalers on one target fight each other.
# Requests per second is the signal users feel; CPU stays as a safety net.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: weather-app
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: weather-app
  minReplicaCount: 3
  maxReplicaCount: 12
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-stack-prometheus.monitoring.svc:9090
        # Target 20 requests per second per pod.
        query: sum(rate(http_requests_total{namespace="NAMESPACE",route="/api/weather"}[2m]))   # patched per environment
        threshold: "20"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
