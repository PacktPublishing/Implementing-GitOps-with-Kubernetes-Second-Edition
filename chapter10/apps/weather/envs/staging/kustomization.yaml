# staging: production-like release process (canary + analysis) on
# non-production infrastructure. Kargo promotes here automatically once a
# version is healthy in dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weather-staging

resources:
  - ../../base

components:
  - ../../components/metrics
  - ../../components/external-secret
  - ../../components/public-endpoint
  - ../../components/canary-analysis
  - ../../components/hpa
  - ../../components/vpa

images:
  - name: weather-app
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/weather-app
    newTag: 3.0.0

configMapGenerator:
  - name: weather-config
    literals:
      - APP_ENVIRONMENT=staging
      - CLOUD_PROVIDER=azure
      - CACHE_TTL_SECONDS=300
      - FAULT_ERROR_RATE=0

patches:
  # One hostname per environment for the Gateway listeners and the routes.
  - target: { kind: Gateway, name: weather }
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: weather-staging.REPLACE_WITH_BASE_DOMAIN
      - op: replace
        path: /spec/listeners/1/hostname
        value: weather-staging.REPLACE_WITH_BASE_DOMAIN
  - target: { kind: HTTPRoute }
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: weather-staging.REPLACE_WITH_BASE_DOMAIN
  - target: { kind: Rollout, name: weather-app }
    patch: |-
      - op: replace
        path: /spec/strategy/canary/trafficRouting/plugins/argoproj-labs~1gatewayAPI/namespace
        value: weather-staging
  # This environment's identity and Key Vault secret.
  - target: { kind: ServiceAccount, name: weather-secrets }
    patch: |-
      - op: replace
        path: /metadata/annotations/azure.workload.identity~1client-id
        value: REPLACE_WITH_WEATHER_STAGING_CLIENT_ID
  - target: { kind: ExternalSecret, name: weather-api }
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: weather-api-key-staging
