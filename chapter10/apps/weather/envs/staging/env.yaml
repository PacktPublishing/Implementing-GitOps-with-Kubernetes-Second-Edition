# Where this environment runs. Read by the weather and tenants ApplicationSets
# (platform/hub/applicationsets). Changing "cluster" moves the environment.
env: staging
cluster: aks-ch10-nonprod
namespace: weather-staging
tier: nonprod
# Entra ID group of the weather team (object ID). Bound to read-only access
# in the namespace by the platform's tenant chart.
teamGroupObjectId: REPLACE_WITH_TEAM_GROUP_OBJECT_ID
