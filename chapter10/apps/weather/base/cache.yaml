# A deliberately disposable cache. Nothing is persisted (--save "" and no
# append-only file): losing it costs a few extra provider calls, never data.
# That is a design decision with consequences for recovery (H5): Git can
# rebuild this component completely. A store holding data you cannot lose
# belongs in a managed service with its own backups (Azure Managed Redis,
# Amazon ElastiCache), referenced from here by its endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-cache
  labels:
    app.kubernetes.io/name: weather-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 96Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weather-cache
  labels:
    app.kubernetes.io/name: weather-cache
spec:
  selector:
    app.kubernetes.io/name: weather-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
