# A local cluster shaped like the real ones: one control plane and two
# workers in two "zones", so topology spread constraints and the
# PodDisruptionBudget behave as they do on AKS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: weather-local
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
