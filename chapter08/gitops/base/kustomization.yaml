apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The portable core: nothing in this directory names a cloud provider, a registry
# host, an account or subscription ID, a storage class or a load balancer
# annotation. Everything provider-specific lives in overlays/.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: gitops-chapter08
