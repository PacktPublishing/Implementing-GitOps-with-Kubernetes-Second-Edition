apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The portable core: nothing in this directory names a cloud provider, a registry
# host, a tenant or account identifier, a storage class or a load balancer
# annotation. Everything provider-specific lives in overlays/.
# (The chapter's portability check greps this directory for registry hosts and
# account identifiers, so keep even comments free of them.)
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: gitops-chapter08
