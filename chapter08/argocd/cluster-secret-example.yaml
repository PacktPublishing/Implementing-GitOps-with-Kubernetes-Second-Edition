# Registering an EKS cluster with the managed capability. Note `config.awsAuthConfig`
# is absent: the capability uses EKS access entries, so no IAM role chaining or
# exec plugin is required. The `cloud` label is what the ApplicationSet selects on.
#
# Apply with kubectl, or better, manage it through your secrets workflow -
# Chapter 12 covers that properly.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-eks-gitops-ch08
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cloud: aws
    environment: production
type: Opaque
stringData:
  name: eks-gitops-ch08
  # Cluster ARN, not the API server endpoint.
  server: arn:aws:eks:eu-central-1:ACCOUNT_ID:cluster/eks-gitops-ch08
  config: |
    {}
