# Drift and reconciliation failures need a destination. Chapter 11 covers
# alerting strategy; this is the minimum wiring so a failed Kustomization is not
# discovered by a user reporting an outage.
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: platform-alerts
  namespace: flux-system
spec:
  type: generic
  address: http://alert-forwarder.observability.svc.cluster.local/flux
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: reconciliation-failures
  namespace: flux-system
spec:
  providerRef:
    name: platform-alerts
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
