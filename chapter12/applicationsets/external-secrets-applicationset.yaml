# ESO everywhere; the cloud label picks the values file and the store overlay.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: cloud
              operator: In
              values: [azure, aws]
  template:
    metadata:
      name: 'external-secrets-{{.name}}'
    spec:
      project: platform-security
      source:
        repoURL: https://github.com/PacktPublishing/Implementing-GitOps-with-Kubernetes-Second-Edition.git
        targetRevision: main
        path: chapter12/secrets/external-secrets
        helm:
          releaseName: external-secrets
          valueFiles:
            - values.yaml
            - 'values-{{index .metadata.labels "cloud"}}.yaml'
      destination:
        name: '{{.name}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: false        # never prune the operator that holds secrets
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
