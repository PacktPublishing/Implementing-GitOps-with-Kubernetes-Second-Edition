# SOPS creation rules. The first rule whose path_regex matches is used.
# Only data/stringData are encrypted so reviewers can still read the
# kind, name and namespace in a pull request.
creation_rules:
  # Production on AKS: key wrapped by Azure Key Vault.
  - path_regex: clusters/aks-prod/.*\.yaml$
    encrypted_regex: ^(data|stringData)$
    azure_keyvault: https://kv-gitops-ch12.vault.azure.net/keys/sops/REPLACE_WITH_KEY_VERSION

  # Production on EKS: key wrapped by AWS KMS.
  - path_regex: clusters/eks-prod/.*\.yaml$
    encrypted_regex: ^(data|stringData)$
    kms: arn:aws:kms:eu-central-1:ACCOUNT_ID:alias/sops-gitops-ch12

  # Everything else (kind clusters, development): age.
  # Add one recipient per cluster plus one for the break-glass key.
  - path_regex: .*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1REPLACE_WITH_CLUSTER_RECIPIENT,
      age1REPLACE_WITH_BREAK_GLASS_RECIPIENT
