# Flux decrypts SOPS-encrypted Secrets in memory, just before apply.
# Nothing decrypted is written to the source artifact or to Git.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weather-app-secrets
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./chapter12/secrets/sops/clusters/dev
  prune: true
  targetNamespace: weather-app
  decryption:
    provider: sops
    # age: the private key lives in this Secret, created out of band.
    secretRef:
      name: sops-age
    # Cloud KMS instead of age: remove secretRef and grant the
    # kustomize-controller identity decrypt rights on the key (Chapter 8
    # shows the federation). With the ObjectLevelWorkloadIdentity feature
    # gate, a per-tenant identity can be used instead:
    # serviceAccountName: weather-app-sops
