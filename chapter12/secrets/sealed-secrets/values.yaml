sealed-secrets:
  # A stable name lets kubeseal find the controller without extra flags.
  fullnameOverride: sealed-secrets-controller
  # Rotate the sealing key every 30 days. Old keys are kept so existing
  # SealedSecrets still decrypt; re-seal on a schedule to retire them.
  keyrenewperiod: "720h"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
