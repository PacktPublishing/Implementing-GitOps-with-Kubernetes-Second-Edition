external-secrets:
  installCRDs: true
  # Namespaced SecretStores are the tenant boundary. Restrict who may create
  # ClusterSecretStores with RBAC and a policy (see policy/kyverno).
  processClusterStore: true
  processPushSecret: false   # enable only where a workflow needs it
  serviceAccount:
    name: external-secrets
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
