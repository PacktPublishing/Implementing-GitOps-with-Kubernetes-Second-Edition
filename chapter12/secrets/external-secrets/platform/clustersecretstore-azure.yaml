# Platform-owned store, used only by ClusterExternalSecrets that the
# platform team itself manages (for example, the registry pull secret).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-platform-ch12.vault.azure.net
      serviceAccountRef:
        name: eso-platform
        namespace: external-secrets
