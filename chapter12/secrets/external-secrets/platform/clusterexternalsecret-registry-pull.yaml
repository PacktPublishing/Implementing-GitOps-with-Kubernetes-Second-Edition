# Replaces the first edition's ESO + Kyverno combination: ESO now fans a
# secret out to every namespace that opts in with a label.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: registry-pull
spec:
  namespaceSelectors:
    - matchLabels:
        platform.gitops.io/registry-pull: "true"
  refreshTime: 1h
  externalSecretName: registry-pull
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: platform-secrets
    target:
      name: registry-pull
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ .dockerconfig | toString }}"
    data:
      - secretKey: dockerconfig
        remoteRef:
          key: platform-registry-dockerconfig
