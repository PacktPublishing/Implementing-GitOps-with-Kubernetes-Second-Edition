apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloud-secrets
  namespace: weather-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      # The controller's Pod Identity role assumes this narrower role.
      role: arn:aws:iam::ACCOUNT_ID:role/eks-gitops-ch08-weather-app-secrets
      # Adds esoNamespace/esoStoreName/esoStoreKind as STS session tags,
      # which the role's policy compares with the secret's tags (ABAC).
      sessionTagsPolicy: Simple
