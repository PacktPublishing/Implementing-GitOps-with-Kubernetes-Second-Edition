  name: cloud-secrets
  namespace: weather-app
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-gitops-ch12.vault.azure.net
      serviceAccountRef:
        name: eso-reader
