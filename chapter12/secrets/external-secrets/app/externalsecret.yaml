# Portable: identical on AKS and EKS. Only the SecretStore differs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-db
  namespace: weather-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: cloud-secrets
  target:
    name: weather-db
    creationPolicy: Owner      # the Secret is garbage-collected with this object
    deletionPolicy: Retain     # a missing remote value never blanks a running app
  data:
    - secretKey: password
      remoteRef:
        key: weather-app-db
