apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://localhost:8080
  # Chapter 8 already runs the managed EKS capability for Argo CD on the EKS
  # cluster. A distinct installation ID keeps the two instances' tracking
  # annotations apart on the cluster they share.
  installationID: gitops-ch12-hub
  # Single sign-on through Microsoft Entra ID, authenticated with Workload
  # Identity: there is no client secret to store, rotate or leak.
  oidc.config: |
    name: Entra ID
    issuer: https://login.microsoftonline.com/REPLACE_WITH_TENANT_ID/v2.0
    clientID: REPLACE_WITH_ARGOCD_CLIENT_ID
    azure:
      useWorkloadIdentity: true
    requestedScopes: ["openid", "profile", "email"]
    requestedIDTokenClaims:
      groups:
        essential: true
  # No local admin, no anonymous access. Break glass is kubectl (Entra ID +
  # Azure RBAC on AKS), which is audited.
  admin.enabled: "false"
  users.anonymous.enabled: "false"
  # Every sync runs as the service account its AppProject names. Since 3.5
  # this is enforced: a project without a matching destinationServiceAccounts
  # entry cannot sync at all.
  application.sync.impersonation.enabled: "true"
