# For ADDITIONAL AKS spokes of the hub in hub/ (the hub's own cluster is
# declared in hub/argocd/clusters as in-cluster). No bearer token is stored:
# argocd-k8s-auth exchanges the federated token projected into the hub
# components for a short-lived Entra token. Prerequisites on the hub: label
# argocd-application-controller, argocd-applicationset-controller and
# argocd-server pods with azure.workload.identity/use: "true", and annotate
# their service accounts with the client ID of a managed identity that has a
# federated credential per service account. On the spoke (Azure RBAC enabled,
# Kubernetes RBAC still applies), bind that identity's object ID, as a User,
# to the argocd-hub-reader ClusterRole from hub/spoke-bootstrap.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-aks-prod
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cloud: azure
    environment: production
type: Opaque
stringData:
  name: aks-prod
  server: https://REPLACE_WITH_AKS_API_SERVER:443
  config: |
    {
      "execProviderConfig": {
        "command": "argocd-k8s-auth",
        "args": ["azure"],
        "env": {
          "AAD_ENVIRONMENT_NAME": "AzurePublicCloud",
          "AAD_LOGIN_METHOD": "workloadidentity"
        },
        "apiVersion": "client.authentication.k8s.io/v1beta1"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": "REPLACE_WITH_BASE64_CA"
      }
    }
