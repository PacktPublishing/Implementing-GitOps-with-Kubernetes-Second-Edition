apiVersion: v1
kind: Namespace
metadata:
  name: policy-exceptions
---
# Exceptions are code too: reviewed, owned and dated.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: legacy-batch-root
  namespace: policy-exceptions
  annotations:
    platform.gitops.io/owner: team-b
    platform.gitops.io/ticket: SEC-1234
    platform.gitops.io/expires: "2027-03-31"
spec:
  policyRefs:
    - name: require-run-as-non-root
      kind: ValidatingPolicy
  matchConditions:
    - name: legacy-batch-only
      expression: >-
        object.metadata.namespace == 'team-b' &&
        object.metadata.?labels['app'].orValue('') == 'legacy-batch'
