apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: weather-app
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: gitopsch08abc123.azurecr.io/weather-app:2.0.3
---
apiVersion: v1
kind: Pod
metadata:
  name: latest-pod
  namespace: weather-app
spec:
  containers:
    - name: app
      image: nginx:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: untagged-pod
  namespace: weather-app
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      # A registry port is not a tag.
      image: registry.local:5000/weather-app
